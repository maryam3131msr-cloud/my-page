<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>صفحه من</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .page {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
        }

        .top-bar {
            width: 100%;
            background: #c90000;
            color: white;
            font-size: 20px;
            padding: 14px 8px;
            text-align: right;
        }

        .header {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            width: 70px;
            height: 70px;
            border: 2px solid #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #555;
        }

        .title {
            font-size: 30px;
            font-weight: bold;
            color: #222;
        }

    </style>

</head>

<body>

    <div class="page">

        <div class="top-bar">
            سامانه بررسی و تأیید مدارک
        </div>

        <div class="header">

            <div class="logo">
                LOGO
            </div>

            <div class="title">
                سامانه بررسی مدارک
            </div>

        </div>

    </div>

</body>

</html>
