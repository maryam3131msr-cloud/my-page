<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>صفحه من</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ef;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        p {
            text-align: center;
            line-height: 1.8;
        }

        .box {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>عنوان صفحه</h1>

        <p>
            این متن توضیح صفحه من است.
        </p>

        <div class="box">
            <h2>بخش اول</h2>

            <p>
                محتوای مورد نظر خودت را اینجا قرار بده.
            </p>
        </div>

    </div>

</body>
</html>
